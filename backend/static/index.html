<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<title>EERR Mina RA — Dashboard</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.24.7/babel.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<style>
  :root{
    --bg:#0f172a; --panel:#111827; --panel2:#1a2333; --border:#263244;
    --text:#e5e9f0; --muted:#8b96a8; --accent:#3b82f6; --good:#22c55e; --bad:#ef4444;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);color:var(--text);}
  #root{max-width:1180px;margin:0 auto;padding:24px;}
  h1{font-size:22px;margin:0 0 2px 0;}
  .sub{color:var(--muted);font-size:13px;margin-bottom:20px;}
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-bottom:20px;}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:14px 16px;}
  .card .label{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;}
  .card .value{font-size:22px;font-weight:600;margin-top:4px;}
  .card .delta{font-size:13px;margin-top:6px;}
  .good{color:var(--good);} .bad{color:var(--bad);} .muted{color:var(--muted);}
  .tabs{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap;}
  .tab{padding:7px 14px;border-radius:8px;border:1px solid var(--border);background:var(--panel);
       cursor:pointer;font-size:13px;color:var(--muted);}
  .tab.active{background:var(--accent);color:white;border-color:var(--accent);}
  .tab.closed::after{content:" ●";color:var(--good);}
  .panel{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:16px;margin-bottom:20px;}
  .panel h2{font-size:15px;margin:0 0 12px 0;color:var(--text);}
  table{width:100%;border-collapse:collapse;font-size:13px;}
  th,td{padding:7px 8px;text-align:right;border-bottom:1px solid var(--border);}
  th:first-child,td:first-child{text-align:left;color:var(--muted);}
  thead th{color:var(--muted);font-weight:500;font-size:11px;text-transform:uppercase;}
  tr.subtotal td{font-weight:600;background:var(--panel2);}
  tr.subtotal.final td{font-weight:700;color:var(--accent);}
  input.real-input{width:100px;background:#0b1220;border:1px solid var(--border);color:var(--text);
       border-radius:6px;padding:5px 7px;text-align:right;font-size:13px;}
  input.real-input:focus{outline:1px solid var(--accent);}
  .note{font-size:12px;color:var(--muted);margin-top:10px;line-height:1.5;}
  .chart-wrap{height:280px;}
  .save-msg{font-size:12px;color:var(--good);margin-left:8px;}
  .footer{color:var(--muted);font-size:12px;text-align:center;margin-top:24px;}
</style>
</head>
<body>
<div style="display:flex;gap:8px;max-width:1180px;margin:0 auto;padding:16px 24px 0;">
  <a href="/" style="padding:6px 12px;border-radius:8px;background:#3b82f6;color:white;text-decoration:none;font-size:13px;">Estado de Resultados</a>
  <a href="/ingreso_diario.html" style="padding:6px 12px;border-radius:8px;background:#111827;border:1px solid #263244;color:#8b96a8;text-decoration:none;font-size:13px;">Ingreso Diario</a>
  <a href="/resumen_diario.html" style="padding:6px 12px;border-radius:8px;background:#111827;border:1px solid #263244;color:#8b96a8;text-decoration:none;font-size:13px;">Resumen Diario</a>
  <a href="/gantt.html" style="padding:6px 12px;border-radius:8px;background:#111827;border:1px solid #263244;color:#8b96a8;text-decoration:none;font-size:13px;">Carta Gantt</a>
</div>
<div id="root">Cargando…</div>
<script type="text/babel" data-presets="react">
const { useState, useEffect, useRef, useCallback } = React;

const API_BASE = window.EERR_API_BASE || "";
const MONTHS = ["Jun","Jul","Ago","Sep","Oct","Nov","Dic"];

const DETAIL_ROWS = [
  {key:"venta_concentrado", indent:0},
  {sep:"COSTOS DE MINA"},
  {key:"mo", indent:1}, {key:"arriendo_equipos", indent:1}, {key:"mantencion_equipos", indent:1},
  {key:"combustible", indent:1}, {key:"explosivos", indent:1}, {key:"aceros", indent:1},
  {key:"fortificacion", indent:1}, {key:"servicios_mina", indent:1},
  {sep:"GASTOS PLANTA Y OVERHEAD"},
  {key:"procesamiento_planta", indent:1}, {key:"admin_overhead", indent:1},
  {sep:"OTROS"},
  {key:"da_participacion", indent:1}, {key:"intereses", indent:1},
];

const SUBTOTAL_ROWS = [
  {key:"total_costos_mina", label:"TOTAL COSTOS MINA"},
  {key:"utilidad_bruta", label:"UTILIDAD BRUTA"},
  {key:"total_planta_overhead", label:"TOTAL PLANTA + OVERHEAD"},
  {key:"ebitda", label:"EBITDA"},
  {key:"impuesto", label:"IMPUESTO (27%)"},
  {key:"utilidad_neta", label:"UTILIDAD NETA", final:true},
];

function fmtCLP(v){
  if (v === null || v === undefined) return "—";
  return "$" + Math.round(v).toLocaleString("es-CL");
}
function fmtPct(v){
  if (v === null || v === undefined) return "N/A";
  return (v*100).toFixed(1) + "%";
}
function deltaClass(v){
  if (v === null || v === undefined) return "muted";
  return v >= 0 ? "good" : "bad";
}

function Card({label, presup, real, varpct}) {
  return (
    <div className="card">
      <div className="label">{label}</div>
      <div className="value">{fmtCLP(real !== null && real !== undefined ? real : presup)}</div>
      <div className={"delta " + deltaClass(varpct)}>
        {real === null || real === undefined
          ? <span className="muted">presup. {fmtCLP(presup)}</span>
          : <span>{varpct>=0 ? "▲" : "▼"} {fmtPct(varpct)} vs presup.</span>}
      </div>
    </div>
  );
}

function App(){
  const [data, setData] = useState(null);
  const [month, setMonth] = useState("Ago");
  const [error, setError] = useState(null);
  const [saveMsg, setSaveMsg] = useState("");
  const chartRef = useRef(null);
  const chartInstance = useRef(null);

  const load = useCallback(() => {
    fetch(API_BASE + "/api/eerr")
      .then(r => { if(!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
      .then(d => { setData(d); setError(null); })
      .catch(e => setError(e.message));
  }, []);

  useEffect(() => { load(); }, [load]);

  useEffect(() => {
    if (!data) return;
    const ctx = chartRef.current.getContext("2d");
    const ebitdaPresup = MONTHS.map(m => data.months[m].ebitda.presup);
    const ebitdaReal = MONTHS.map(m => data.months[m].ebitda.real);
    const netaReal = MONTHS.map(m => data.months[m].utilidad_neta.real);
    if (chartInstance.current) chartInstance.current.destroy();
    chartInstance.current = new Chart(ctx, {
      type: "line",
      data: {
        labels: MONTHS,
        datasets: [
          {label:"EBITDA Presup.", data:ebitdaPresup, borderColor:"#3b82f6", borderDash:[5,5], pointRadius:2, tension:.25},
          {label:"EBITDA Real", data:ebitdaReal, borderColor:"#22c55e", pointRadius:3, tension:.25},
          {label:"Utilidad Neta Real", data:netaReal, borderColor:"#f59e0b", pointRadius:3, tension:.25},
        ]
      },
      options: {
        responsive:true, maintainAspectRatio:false,
        plugins:{ legend:{ labels:{ color:"#e5e9f0" } } },
        scales:{
          x:{ ticks:{color:"#8b96a8"}, grid:{color:"#263244"} },
          y:{ ticks:{color:"#8b96a8", callback:v=>fmtCLP(v)}, grid:{color:"#263244"} }
        }
      }
    });
  }, [data]);

  const saveReal = (lineKey, m, value) => {
    const parsed = value === "" ? null : Number(value);
    if (parsed !== null && Number.isNaN(parsed)) return;
    fetch(API_BASE + "/api/eerr/real", {
      method: "POST",
      headers: {"Content-Type":"application/json"},
      body: JSON.stringify({line: lineKey, month: m, value: parsed})
    })
      .then(r => r.json())
      .then(d => { setData(d); setSaveMsg("Guardado ✓"); setTimeout(()=>setSaveMsg(""), 1500); })
      .catch(e => setError(e.message));
  };

  if (error) {
    return <div className="panel">
      <h2>No se pudo conectar a la API ({API_BASE})</h2>
      <p className="note">Verifica que el backend esté corriendo:<br/><code>cd backend &amp;&amp; pip install -r requirements.txt &amp;&amp; uvicorn main:app --reload</code></p>
      <p className="note">Error: {error}</p>
    </div>;
  }
  if (!data) return <div>Cargando…</div>;

  const mo = data.months[month];
  const isClosed = data.closed_months.includes(month);

  return (
    <div>
      <h1>⛏ Estado de Resultados — {data.meta.mina}</h1>
      <div className="sub">{data.meta.periodo} · {data.meta.moneda} · {data.meta.tipo_cambio} · calculado en Python, servido vía FastAPI</div>

      <div className="cards">
        <Card label={"Ingresos · " + month} presup={mo.total_ingresos.presup} real={mo.total_ingresos.real} varpct={mo.total_ingresos.var_pct} />
        <Card label={"EBITDA · " + month} presup={mo.ebitda.presup} real={mo.ebitda.real} varpct={mo.ebitda.var_pct} />
        <Card label={"Utilidad Neta · " + month} presup={mo.utilidad_neta.presup} real={mo.utilidad_neta.real} varpct={mo.utilidad_neta.var_pct} />
        <div className="card">
          <div className="label">Margen EBITDA</div>
          <div className="value">{fmtPct(mo.margenes.ebitda_pct)}</div>
          <div className="delta muted">Margen Neto {fmtPct(mo.margenes.neto_pct)}</div>
        </div>
      </div>

      <div className="tabs">
        {MONTHS.map(m => (
          <div key={m}
               className={"tab" + (m===month?" active":"") + (data.closed_months.includes(m)?" closed":"")}
               onClick={()=>setMonth(m)}>{m}</div>
        ))}
      </div>

      <div className="panel">
        <h2>Detalle {month} {isClosed ? "· mes cerrado" : "· proyección — edita \"Real\" para simular el cierre"} {saveMsg && <span className="save-msg">{saveMsg}</span>}</h2>
        <table>
          <thead>
            <tr><th>Línea</th><th>Presup.</th><th>Real</th><th>Var $</th><th>Var %</th></tr>
          </thead>
          <tbody>
            {DETAIL_ROWS.map((row,i) => {
              if (row.sep) return <tr key={"sep"+i}><td colSpan="5" style={{color:"#8b96a8",fontSize:"11px",paddingTop:"12px",textTransform:"uppercase"}}>{row.sep}</td></tr>;
              const line = data.detail_lines[row.key];
              const v = line.months[month];
              return (
                <tr key={row.key}>
                  <td style={{paddingLeft: (row.indent*16)+8}}>{line.label}</td>
                  <td>{fmtCLP(v.presup)}</td>
                  <td>
                    <input className="real-input" type="number" defaultValue={v.real ?? ""}
                      placeholder="—"
                      onBlur={(e)=>saveReal(row.key, month, e.target.value)} />
                  </td>
                  <td className={deltaClass(v.var)}>{v.var===null?"—":fmtCLP(v.var)}</td>
                  <td className={deltaClass(v.var_pct)}>{fmtPct(v.var_pct)}</td>
                </tr>
              );
            })}
            {SUBTOTAL_ROWS.map(row => {
              const v = mo[row.key];
              return (
                <tr key={row.key} className={"subtotal" + (row.final?" final":"")}>
                  <td>{row.label}</td>
                  <td>{fmtCLP(v.presup)}</td>
                  <td>{fmtCLP(v.real)}</td>
                  <td className={deltaClass(v.var)}>{v.var===null?"—":fmtCLP(v.var)}</td>
                  <td className={deltaClass(v.var_pct)}>{fmtPct(v.var_pct)}</td>
                </tr>
              );
            })}
          </tbody>
        </table>
        <p className="note">Los campos "Real" se editan directamente (Tab o click fuera del campo para guardar) y llaman a <code>POST /api/eerr/real</code>, que recalcula toda la cascada en el backend.</p>
      </div>

      <div className="panel">
        <h2>Tendencia EBITDA / Utilidad Neta (Presup. vs Real, Jun–Dic)</h2>
        <div className="chart-wrap"><canvas ref={chartRef}></canvas></div>
      </div>

      <div className="panel">
        <h2>YTD Acumulado — solo meses cerrados ({data.closed_months.join(", ") || "ninguno aún"})</h2>
        <table>
          <thead><tr><th>Línea</th><th>Presup. YTD</th><th>Real YTD</th><th>Var $</th><th>Var %</th></tr></thead>
          <tbody>
            {["total_ingresos","ebitda","utilidad_neta"].map(k => {
              const v = data.ytd[k];
              return <tr key={k}><td>{k==="total_ingresos"?"TOTAL INGRESOS":k==="ebitda"?"EBITDA":"UTILIDAD NETA"}</td>
                <td>{fmtCLP(v.presup)}</td><td>{fmtCLP(v.real)}</td>
                <td className={deltaClass(v.var)}>{v.var===null?"—":fmtCLP(v.var)}</td>
                <td className={deltaClass(v.var_pct)}>{fmtPct(v.var_pct)}</td></tr>;
            })}
          </tbody>
        </table>
        <p className="note">
          A diferencia del Excel original (que comparaba el Real acumulado contra el presupuesto de los <b>12 meses completos</b>,
          arrojando siempre variaciones cercanas a -100% a mitad de año), este modelo acumula el presupuesto
          <b> solo de los meses que ya tienen Real cargado</b>, para que el % sea comparable.
        </p>
      </div>

      <div className="footer">Motor de cálculo: Python (FastAPI) · Interfaz: React · Datos base: {data.meta.fuente}</div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
